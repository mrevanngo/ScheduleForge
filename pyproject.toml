[project]
name = "scheduleforge"
version = "0.1.0"
description = "Adaptive daily schedule optimizer for busy students"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
]

[project.scripts]
scheduleforge = "scheduleforge.main:app"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
